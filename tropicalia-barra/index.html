<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Cardápio do Restaurante Tropicália em Salvador."
  >
  <meta name="theme-color" content="#171916">

  <title>Restaurante Tropicália | Cardápio</title>

  <style>
    :root {
      --preto: #171916;
      --amarelo: #f2c313;
      --amarelo-claro: #ffdc57;
      --branco: #f8f4e8;
      --cinza: #c9c6ba;
      --madeira-1: #5f3c25;
      --madeira-2: #9c7045;
      --borda: rgba(255, 255, 255, 0.13);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 18px 12px 38px;
      background:
        radial-gradient(
          circle at top,
          rgba(255, 220, 87, 0.3),
          transparent 35%
        ),
        var(--amarelo);
      color: var(--branco);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .pagina {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .idiomas {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .idiomas a {
      min-width: 50px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      color: var(--preto);
      font-size: 0.74rem;
      font-weight: 900;
      text-align: center;
      text-decoration: none;
    }
