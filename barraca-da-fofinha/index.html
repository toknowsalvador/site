<!doctype html>
<html lang="pt-BR" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6c800" />

  <title>Barraca da Fofinha — Cardápio</title>

  <style>
    :root{
      --yellow:#f6c800;
      --yellow-2:#ffdc24;
      --blue:#10a9e7;
      --blue-dark:#087db0;
      --purple:#5a3b91;
      --red:#d51f4a;
      --aqua:#00a9df;
      --ink:#242424;
      --paper:#fffdf5;
      --sand:#f1dfb6;
      --line:rgba(63,49,19,.13);
      --shadow:0 12px 30px rgba(56,42,0,.14);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      color:var(--ink);

      background:
        radial-gradient(
          circle at 8% 8%,
          rgba(16,169,231,.14),
          transparent 22rem
        ),
        linear-gradient(
          180deg,
          #fff7cf 0,
          #f6e7bf 42%,
          #efe0bd 100%
        );

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    a{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .top-shell{
      position:sticky;
      top:0;
      z-index:50;

      background:
        rgba(246,200,0,.96);

      backdrop-filter:
        blur(12px);

      box-shadow:
        0 6px 20px rgba(66,46,0,.10);

      border-bottom:
        1px solid rgba(80,54,0,.12);
    }

    .brand-row{
      max-width:1100px;
      margin:auto;

      padding:
        14px
        16px
        8px;

      display:flex;

      align-items:center;
      justify-content:space-between;

      gap:12px;
    }

    .brand-mini{
      min-width:0;

      font-weight:1000;

      letter-spacing:-.03em;

      color:var(--blue);

      text-shadow:
        1px 1px 0 rgba(0,0,0,.55);

      font-size:
        clamp(1.4rem,5vw,2.1rem);

      white-space:nowrap;
    }

    .brand-icons{
      font-size:1.55rem;

      white-space:nowrap;
    }

    .scroll-row{
      display:flex;

      gap:8px;

      overflow-x:auto;

      overscroll-behavior-inline:
        contain;

      scrollbar-width:none;

      padding:
        8px
        16px
        12px;

      max-width:1100px;

      margin:auto;

      -webkit-overflow-scrolling:
        touch;

      direction:ltr;
    }

    .scroll-row::-webkit-scrollbar{
      display:none;
    }

    .lang-btn,
    .nav-btn{
      flex:0 0 auto;

      border:0;

      border-radius:999px;

      padding:
        10px
        14px;

      font-weight:900;

      white-space:nowrap;

      transition:.18s ease;
    }

    .lang-btn{
      background:#fff8cf;

      color:#47346f;

      box-shadow:
        inset 0 0 0 1px rgba(91,62,145,.18);
    }

    .lang-btn.active{
      background:var(--purple);

      color:#fff;

      box-shadow:
        0 5px 12px rgba(90,59,145,.24);
    }

    main{
      max-width:1100px;

      margin:auto;

      padding:
        0
        16px
        56px;
    }

    .hero{
      margin-top:18px;

      position:relative;

      overflow:hidden;

      border-radius:32px;

      padding:
        26px
        20px;

      background:
        radial-gradient(
          circle at 88% 20%,
          rgba(255,255,255,.26),
          transparent 8rem
        ),
        linear-gradient(
          145deg,
          var(--yellow-2),
          var(--yellow)
        );

      box-shadow:
        var(--shadow);

      border:
        1px solid rgba(112,76,0,.15);
    }

    .hero::before{
      content:"🌴";

      position:absolute;

      left:-8px;

      top:-14px;

      font-size:5.5rem;

      transform:
        rotate(-10deg);

      opacity:.95;
    }

    .hero::after{
      content:"🏖️";

      position:absolute;

      right:12px;

      top:8px;

      font-size:4.2rem;

      opacity:.92;
    }

    .hero-content{
      position:relative;

      z-index:2;

      text-align:center;
    }

    .hero h1{
      margin:0;

      font-size:
        clamp(2.45rem,10vw,5.4rem);

      line-height:.92;

      letter-spacing:-.055em;

      color:var(--blue);

      text-shadow:
        2px 3px 0 #15537a,
        4px 6px 0 rgba(255,255,255,.26);

      font-weight:1000;
    }

    .hero-sub{
      margin:
        12px
        0
        0;

      color:var(--red);

      font-size:
        clamp(1.15rem,4.4vw,1.75rem);

      font-weight:1000;
    }

    .hero-note{
      margin:
        8px
        auto
        0;

      max-width:620px;

      font-weight:800;

      color:#5c4688;
    }

    .info-grid{
      margin-top:16px;

      display:grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap:12px;
    }

    .info-card{
      background:
        rgba(255,255,255,.88);

      border:
        1px solid rgba(74,54,19,.10);

      box-shadow:
        0 8px 24px rgba(66,46,0,.08);

      border-radius:20px;

      padding:15px;
    }

    .info-card strong{
      display:block;

      color:var(--purple);

      font-size:.78rem;

      text-transform:uppercase;

      letter-spacing:.08em;
    }

    .info-card .big{
      display:block;

      margin-top:5px;

      color:var(--blue-dark);

      font-size:1.1rem;

      font-weight:1000;
    }

    .info-card .small{
      display:block;

      margin-top:2px;

      font-size:.88rem;

      opacity:.78;
    }

    .pix-card{
      grid-column:1/-1;
    }

    .pix-actions{
      margin-top:12px;

      display:flex;

      flex-wrap:wrap;

      gap:8px;

      align-items:center;
    }

    .copy-btn{
      border:0;

      border-radius:999px;

      padding:
        10px
        14px;

      background:
        var(--purple);

      color:#fff;

      font-weight:1000;

      box-shadow:
        0 5px 12px rgba(90,59,145,.20);
    }

    .copy-status{
      min-height:1.2em;

      font-size:.86rem;

      font-weight:900;

      color:#14804a;
    }

    .category-shell{
      margin:
        16px
        -16px
        0;

      background:
        rgba(255,253,245,.65);

      border-block:
        1px solid rgba(80,54,0,.08);
    }

    .nav-btn{
      background:#fff;

      color:var(--purple);

      box-shadow:
        0 4px 14px rgba(62,45,0,.08);
    }

    .nav-btn:hover,
    .nav-btn:focus-visible{
      background:var(--red);

      color:#fff;

      outline:none;
    }

    #menu{
      display:grid;

      gap:18px;

      margin-top:18px;
    }

    .section-card{
      overflow:hidden;

      background:
        rgba(255,253,245,.95);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);

      border:
        1px solid rgba(80,54,0,.10);

      scroll-margin-top:125px;
    }

    .section-head{
      padding:
        16px
        18px
        12px;

      display:flex;

      align-items:end;

      justify-content:space-between;

      gap:14px;

      background:
        linear-gradient(
          90deg,
          rgba(246,200,0,.28),
          rgba(16,169,231,.08)
        );

      border-bottom:
        1px solid var(--line);
    }

    .section-title{
      margin:0;

      color:var(--red);

      font-size:1.55rem;

      line-height:1;

      font-weight:1000;
    }

    .section-icon{
      font-size:1.55rem;
    }

    .section-note{
      padding:
        10px
        18px;

      background:
        rgba(0,169,223,.11);

      color:#057ea8;

      font-weight:900;

      border-bottom:
        1px solid rgba(0,169,223,.13);
    }

    .items{
      padding:
        4px
        0;
    }

    .menu-item{
      display:grid;

      grid-template-columns:
        auto
        minmax(0,1fr)
        auto;

      gap:11px;

      align-items:start;

      padding:
        13px
        18px;

      border-bottom:
        1px dashed var(--line);
    }

    .menu-item:last-child{
      border-bottom:0;
    }

    .item-number{
      min-width:35px;

      height:31px;

      display:inline-flex;

      align-items:center;

      justify-content:center;

      border-radius:9px;

      background:
        var(--yellow);

      color:#4e347f;

      font-size:.83rem;

      font-weight:1000;

      border:
        1px solid rgba(80,54,0,.13);

      box-shadow:
        0 2px 0 rgba(0,0,0,.08);

      direction:ltr;
    }

    .item-name{
      font-weight:900;

      color:#4e347f;

      line-height:1.25;
    }

    .item-desc{
      display:block;

      margin-top:3px;

      font-size:.82rem;

      font-weight:650;

      color:#6b6253;
    }

    .price{
      white-space:nowrap;

      font-weight:1000;

      color:#171717;

      background:#fff;

      border:
        1px solid rgba(0,0,0,.26);

      border-radius:8px;

      padding:
        4px
        8px;

      box-shadow:
        0 2px 0 rgba(0,0,0,.16);

      direction:ltr;
    }

    .tours-section{
      margin-top:18px;

      scroll-margin-top:125px;

      overflow:hidden;

      background:
        rgba(255,253,245,.95);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);

      border:
        1px solid rgba(80,54,0,.10);
    }

    .tours-intro{
      padding:
        12px
        18px
        0;

      font-weight:800;

      color:#645675;
    }

    .tour-scroll{
      display:flex;

      gap:14px;

      overflow-x:auto;

      scrollbar-width:none;

      padding:
        16px
        18px
        20px;

      -webkit-overflow-scrolling:
        touch;

      scroll-snap-type:
        x proximity;

      direction:ltr;
    }

    .tour-scroll::-webkit-scrollbar{
      display:none;
    }

    .tour-card{
      flex:
        0 0 min(82vw,310px);

      scroll-snap-align:start;

      min-height:215px;

      display:flex;

      flex-direction:column;

      justify-content:space-between;

      gap:16px;

      padding:18px;

      border-radius:22px;

      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(255,255,255,.35),
          transparent 7rem
        ),
        linear-gradient(
          145deg,
          #fff7cf,
          #ffe168
        );

      border:
        1px solid rgba(112,76,0,.14);

      box-shadow:
        0 8px 20px rgba(66,46,0,.10);
    }

    .tour-card .tour-icon{
      font-size:2rem;
    }

    .tour-card h3{
      margin:
        7px
        0
        0;

      color:#4e347f;

      font-size:1.2rem;

      line-height:1.15;
    }

    .tour-cta{
      display:inline-flex;

      align-items:center;

      justify-content:center;

      text-decoration:none;

      border-radius:999px;

      padding:
        11px
        14px;

      background:#25D366;

      color:#083e1d;

      font-weight:1000;

      box-shadow:
        0 5px 12px rgba(37,211,102,.22);
    }

    .bottom-info{
      margin-top:18px;
    }

    .footer{
      margin-top:22px;

      border-radius:24px;

      padding:
        22px
        18px;

      text-align:center;

      background:
        linear-gradient(
          145deg,
          #0faae8,
          #138bc1
        );

      color:#fff;

      box-shadow:
        var(--shadow);
    }

    .footer strong{
      font-size:1.25rem;
    }

    .footer p{
      margin:
        8px
        0
        0;

      font-weight:700;
    }

    [dir="rtl"] .menu-item,
    [dir="rtl"] .section-head,
    [dir="rtl"] .info-card,
    [dir="rtl"] .tour-card{
      text-align:right;
    }

    @media (min-width:760px){

      .info-grid{
        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );
      }

      #menu{
        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );

        align-items:start;
      }

      .section-card.full{
        grid-column:1/-1;
      }
    }

    @media (max-width:520px){

      .info-grid{
        grid-template-columns:1fr;
      }

      .hero{
        padding:
          24px
          14px;
      }

      .hero::before{
        font-size:4.4rem;
      }

      .hero::after{
        font-size:3.3rem;
      }

      .menu-item{
        padding:
          12px
          14px;
      }
    }
  </style>
</head>

    <!-- PAGAMENTO E MOEDA NO FINAL -->

    <section class="info-grid bottom-info">

    </section>


    <footer class="footer">

      <strong id="footerTitle">
        Barraca da Fofinha ☀️
      </strong>

      <p id="footerText"></p>

    </footer>

  </main>

/* =========================================================

========================================================= */

let currentLang =
  'pt';


const langIndex = {

  pt:0,

  en:1,

  es:2,

  fr:3,

  it:4,

  ru:5,

  he:6

};


/* Número do Pix / contato */

const PIX_COPY_NUMBER =
  '+5571992670738';


/* WhatsApp dos passeios */

const TOUR_WHATSAPP =
  '5571993719791';


/* =========================================================
   PREÇO
========================================================= */

function money(value){

  return `R$ ${Number(value)
    .toFixed(2)
    .replace('.',',')}`;

}


/* =========================================================
   IDIOMAS
========================================================= */

function buildLanguages(){

  const element =
    document.getElementById('languages');


  element.innerHTML =
    LANGS.map(([code,label]) => `

      <button
        class="lang-btn ${code === currentLang ? 'active' : ''}"
        data-lang="${code}"
        type="button">

        ${label}

      </button>

    `).join('');


  element
    .querySelectorAll('button')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          currentLang =
            button.dataset.lang;


          document.documentElement.lang =
            currentLang;


          document.documentElement.dir =
            currentLang === 'he'
              ? 'rtl'
              : 'ltr';


          render();

        }
      );

    });

}


/* =========================================================
   NAVEGAÇÃO DO CARDÁPIO
   NÃO REMOVE NENHUMA SEÇÃO
========================================================= */

function buildCategoryNav(){

  const t =
    UI[currentLang];


  const categories = [

    'meals',

    'snacks',

    'soups',

    'soft',

    'beers',

    'drinks',

    'tours'

  ];


  const element =
    document.getElementById('categoryNav');


  element.innerHTML =
    categories.map(category => `

      <button
        class="nav-btn"
        data-target="section-${category}"
        type="button">

        ${t[category]}

      </button>

    `).join('');


  element
    .querySelectorAll('button')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          const target =
            document.getElementById(
              button.dataset.target
            );


          if(target){

            target.scrollIntoView({

              behavior:'smooth',

              block:'start'

            });

          }

        }
      );

    });

}


/* =========================================================
   CARDÁPIO
========================================================= */

function renderMenu(){

  const t =
    UI[currentLang];


  const index =
    langIndex[currentLang];


  /*
    A numeração é única e permanece a mesma
    independentemente do idioma escolhido.
  */

  let number =
    0;


  document
    .getElementById('menu')
    .innerHTML =

    MENU.map(section => {


      const note =
        section.note

        ? `
          <div class="section-note">
            ${t[section.note]}
          </div>
        `

        : '';


      const items =
        section.items.map(item => {


          number += 1;


          const code =
            String(number)
              .padStart(2,'0');


          const extraNote =
            item[8]

            ? `
              <span class="item-desc">
                ${t[item[8]]}
              </span>
            `

            : '';


          return `

            <div class="menu-item">


              <span
                class="item-number"
                aria-label="Item ${code}">

                ${code}

              </span>


              <div class="item-name">

                ${item[index]}

                ${extraNote}

              </div>


              <div class="price">

                ${money(item[7])}

              </div>


            </div>

          `;

        }).join('');


      return `

        <article
          id="section-${section.cat}"
          class="section-card ${section.cat === 'meals' ? 'full' : ''}">


          <div class="section-head">


            <h2 class="section-title">

              ${t[section.cat]}

            </h2>


            <div class="section-icon">

              ${section.icon}

            </div>


          </div>


          ${note}


          <div class="items">

            ${items}

          </div>


        </article>

      `;

    }).join('');

}


/* =========================================================
   PASSEIOS
========================================================= */

function renderTours(){

  const t =
    UI[currentLang];


  document
    .getElementById('toursTitle')
    .textContent =
    t.tours;


  document
    .getElementById('toursIntro')
    .textContent =
    t.toursIntro;


  document
    .getElementById('tourScroll')
    .innerHTML =

    TOURS.map(tour => {


      const tourName =
        tour.names[currentLang]
        ||
        tour.names.pt;


      const message =
        t.whatsapp.replace(
          '{tour}',
          tourName
        );


      const url =
        `https://wa.me/${TOUR_WHATSAPP}?text=${encodeURIComponent(message)}`;


      return `

        <article class="tour-card">


          <div>


            <div class="tour-icon">

              ${tour.icon}

            </div>


            <h3>

              ${tourName}

            </h3>


          </div>


          <a
            class="tour-cta"
            href="${url}"
            target="_blank"
            rel="noopener noreferrer">

            ${t.redeem} · WhatsApp

          </a>


        </article>

      `;

    }).join('');

}


/* =========================================================
   COPIAR PIX / CONTATO
========================================================= */

async function copyPix(){

  const t =
    UI[currentLang];


  const status =
    document.getElementById('copyStatus');


  try{


    if(
      navigator.clipboard
      &&
      window.isSecureContext
    ){

      await navigator.clipboard.writeText(
        PIX_COPY_NUMBER
      );

    }

    else{


      const input =
        document.createElement('textarea');


      input.value =
        PIX_COPY_NUMBER;


      input.setAttribute(
        'readonly',
        ''
      );


      input.style.position =
        'fixed';


      input.style.opacity =
        '0';


      document.body.appendChild(
        input
      );


      input.select();


      document.execCommand(
        'copy'
      );


      input.remove();

    }


    status.textContent =
      t.copied;


    setTimeout(
      () => {

        status.textContent =
          '';

      },
      2200
    );

  }

  catch(error){

    status.textContent =
      t.copyFail;

  }

}
