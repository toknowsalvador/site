<head>

  <style>
    :root{
      --yellow:#f6c800;
      --yellow-2:#ffdc24;
      --blue:#10a9e7;
      --blue-dark:#087db0;
      --purple:#5a3b91;
      --red:#d51f4a;
      --aqua:#00a9df;
      --ink:#242424;
      --paper:#fffdf5;
      --sand:#f1dfb6;
      --line:rgba(63,49,19,.13);
      --shadow:0 12px 30px rgba(56,42,0,.14);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      color:var(--ink);
      background:
        radial-gradient(
          circle at 8% 8%,
          rgba(16,169,231,.14),
          transparent 22rem
        ),
        linear-gradient(
          180deg,
          #fff7cf 0,
          #f6e7bf 42%,
          #efe0bd 100%
        );

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button,
    a{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    /* =========================
       TOPO
    ========================== */

    .top-shell{
      position:sticky;
      top:0;
      z-index:50;

      background:rgba(246,200,0,.96);
      backdrop-filter:blur(12px);

      box-shadow:
        0 6px 20px rgba(66,46,0,.10);

      border-bottom:
        1px solid rgba(80,54,0,.12);
    }

    .brand-row{
      max-width:1100px;
      margin:auto;

      padding:
        14px
        16px
        8px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:12px;
    }

    .brand-mini{
      min-width:0;

      font-weight:1000;
      letter-spacing:-.03em;

      color:var(--blue);

      text-shadow:
        1px 1px 0 rgba(0,0,0,.55);

      font-size:
        clamp(1.4rem,5vw,2.1rem);

      white-space:nowrap;
    }

    .brand-icons{
      font-size:1.55rem;
      white-space:nowrap;
    }

    /* =========================
       ROLAGEM HORIZONTAL
    ========================== */

    .scroll-row{
      display:flex;
      gap:8px;

      overflow-x:auto;

      overscroll-behavior-inline:contain;

      scrollbar-width:none;

      padding:
        8px
        16px
        12px;

      max-width:1100px;
      margin:auto;

      -webkit-overflow-scrolling:touch;
    }

    .scroll-row::-webkit-scrollbar{
      display:none;
    }

    .lang-btn,
    .filter-btn{
      flex:0 0 auto;

      border:0;
      border-radius:999px;

      padding:
        10px
        14px;

      font-weight:900;
      white-space:nowrap;

      transition:.18s ease;
    }

    /* =========================
       IDIOMAS
    ========================== */

    .lang-btn{
      background:#fff8cf;
      color:#47346f;

      box-shadow:
        inset 0 0 0 1px rgba(91,62,145,.18);
    }

    .lang-btn.active{
      background:var(--purple);
      color:#fff;

      box-shadow:
        0 5px 12px rgba(90,59,145,.24);
    }

    /* =========================
       CATEGORIAS
    ========================== */

    .filters-shell{
      max-width:1100px;
      margin:16px auto 0;
    }

    .filter-btn{
      background:#fff;
      color:var(--purple);

      box-shadow:
        0 4px 14px rgba(62,45,0,.08);
    }

    .filter-btn.active{
      background:var(--red);
      color:#fff;
    }

    /* =========================
       ESTRUTURA
    ========================== */

    main{
      max-width:1100px;
      margin:auto;

      padding:
        0
        16px
        56px;
    }

    /* =========================
       CAPA
    ========================== */

    .hero{
      margin-top:18px;

      position:relative;
      overflow:hidden;

      border-radius:32px;

      padding:
        26px
        20px;

      background:
        radial-gradient(
          circle at 88% 20%,
          rgba(255,255,255,.26),
          transparent 8rem
        ),
        linear-gradient(
          145deg,
          var(--yellow-2),
          var(--yellow)
        );

      box-shadow:var(--shadow);

      border:
        1px solid rgba(112,76,0,.15);
    }

    .hero::before{
      content:"🌴";

      position:absolute;

      left:-8px;
      top:-14px;

      font-size:5.5rem;

      transform:rotate(-10deg);

      opacity:.95;
    }

    .hero::after{
      content:"🏖️";

      position:absolute;

      right:12px;
      top:8px;

      font-size:4.2rem;

      opacity:.92;
    }

    .hero-content{
      position:relative;
      z-index:2;

      text-align:center;
    }

    .hero h1{
      margin:0;

      font-size:
        clamp(2.45rem,10vw,5.4rem);

      line-height:.92;
      letter-spacing:-.055em;

      color:var(--blue);

      text-shadow:
        2px 3px 0 #15537a,
        4px 6px 0 rgba(255,255,255,.26);

      font-weight:1000;
    }

    .hero-sub{
      margin:
        12px
        0
        0;

      color:var(--red);

      font-size:
        clamp(1.15rem,4.4vw,1.75rem);

      font-weight:1000;
    }

    .hero-note{
      margin:
        8px
        auto
        0;

      max-width:620px;

      font-weight:800;

      color:#5c4688;
    }

    /* =========================
       INFORMAÇÕES
    ========================== */

    .info-grid{
      margin-top:16px;

      display:grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0,1fr)
        );

      gap:12px;
    }

    .info-card{
      background:
        rgba(255,255,255,.88);

      border:
        1px solid rgba(74,54,19,.10);

      box-shadow:
        0 8px 24px rgba(66,46,0,.08);

      border-radius:20px;

      padding:15px;
    }

    .info-card strong{
      display:block;

      color:var(--purple);

      font-size:.78rem;

      text-transform:uppercase;

      letter-spacing:.08em;
    }

    .info-card .big{
      display:block;

      margin-top:5px;

      color:var(--blue-dark);

      font-size:1.1rem;

      font-weight:1000;
    }

    .info-card .small{
      display:block;

      margin-top:2px;

      font-size:.88rem;

      opacity:.78;
    }

    /* =========================
       CARDÁPIO
    ========================== */

    #menu{
      display:grid;

      gap:18px;

      margin-top:18px;
    }

    .section-card{
      overflow:hidden;

      background:
        rgba(255,253,245,.95);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);

      border:
        1px solid rgba(80,54,0,.10);
    }

    .section-head{
      padding:
        16px
        18px
        12px;

      display:flex;

      align-items:end;

      justify-content:space-between;

      gap:14px;

      background:
        linear-gradient(
          90deg,
          rgba(246,200,0,.28),
          rgba(16,169,231,.08)
        );

      border-bottom:
        1px solid var(--line);
    }

    .section-title{
      margin:0;

      color:var(--red);

      font-size:1.55rem;

      line-height:1;

      font-weight:1000;
    }

    .section-icon{
      font-size:1.55rem;
    }

    .section-note{
      padding:
        10px
        18px;

      background:
        rgba(0,169,223,.11);

      color:#057ea8;

      font-weight:900;

      border-bottom:
        1px solid rgba(0,169,223,.13);
    }

    .items{
      padding:
        4px
        0;
    }

    .menu-item{
      display:grid;

      grid-template-columns:
        minmax(0,1fr)
        auto;

      gap:14px;

      align-items:start;

      padding:
        13px
        18px;

      border-bottom:
        1px dashed var(--line);
    }

    .menu-item:last-child{
      border-bottom:0;
    }

    .item-name{
      font-weight:900;

      color:#4e347f;

      line-height:1.25;
    }

    .item-desc{
      display:block;

      margin-top:3px;

      font-size:.82rem;

      font-weight:650;

      color:#6b6253;
    }

    .price{
      white-space:nowrap;

      font-weight:1000;

      color:#171717;

      background:#fff;

      border:
        1px solid rgba(0,0,0,.26);

      border-radius:8px;

      padding:
        4px
        8px;

      box-shadow:
        0 2px 0 rgba(0,0,0,.16);
    }

    /* =========================
       RODAPÉ
    ========================== */

    .footer{
      margin-top:22px;

      border-radius:24px;

      padding:
        22px
        18px;

      text-align:center;

      background:
        linear-gradient(
          145deg,
          #0faae8,
          #138bc1
        );

      color:#fff;

      box-shadow:var(--shadow);
    }

    .footer strong{
      font-size:1.25rem;
    }

    .footer p{
      margin:
        8px
        0
        0;

      font-weight:700;
    }

    /* =========================
       HEBRAICO
    ========================== */

    [dir="rtl"] .menu-item,
    [dir="rtl"] .section-head,
    [dir="rtl"] .info-card{
      text-align:right;
    }

    /* =========================
       DESKTOP
    ========================== */

    @media (min-width:760px){

      .info-grid{
        grid-template-columns:
          repeat(
            3,
            minmax(0,1fr)
          );
      }

      #menu{
        grid-template-columns:
          repeat(
            2,
            minmax(0,1fr)
          );

        align-items:start;
      }

      .section-card.full{
        grid-column:1/-1;
      }
    }

    /* =========================
       CELULAR
    ========================== */

    @media (max-width:520px){

      .info-grid{
        grid-template-columns:1fr;
      }

      .hero{
        padding:
          24px
          14px;
      }

      .hero::before{
        font-size:4.4rem;
      }

      .hero::after{
        font-size:3.3rem;
      }

      .menu-item{
        padding:
          12px
          14px;
      }
    }

  </style>
</head>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

let currentLang = 'pt';

let currentFilter = 'all';


const langIndex = {

  pt:0,

  en:1,

  es:2,

  fr:3,

  it:4,

  ru:5,

  he:6

};


/* =========================================================
   PREÇO
========================================================= */

function money(value){

  return `R$ ${Number(value)
    .toFixed(2)
    .replace('.',',')}`;

}


/* =========================================================
   IDIOMAS
========================================================= */

function buildLanguages(){

  const element =
    document.getElementById('languages');


  element.innerHTML =
    LANGS.map(([code,label]) => `

      <button
        class="lang-btn ${code === currentLang ? 'active' : ''}"
        data-lang="${code}">

        ${label}

      </button>

    `).join('');


  element
    .querySelectorAll('button')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          currentLang =
            button.dataset.lang;


          document.documentElement.lang =
            currentLang;


          document.documentElement.dir =
            currentLang === 'he'
              ? 'rtl'
              : 'ltr';


          render();

        }
      );

    });

}


/* =========================================================
   FILTROS
========================================================= */

function buildFilters(){

  const t =
    UI[currentLang];


  const filters = [

    'all',

    'meals',

    'snacks',

    'soups',

    'soft',

    'beers',

    'drinks'

  ];


  const element =
    document.getElementById('filters');


  element.innerHTML =
    filters.map(category => `

      <button
        class="filter-btn ${category === currentFilter ? 'active' : ''}"
        data-filter="${category}">

        ${t[category]}

      </button>

    `).join('');


  element
    .querySelectorAll('button')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          currentFilter =
            button.dataset.filter;


          renderMenu();

          buildFilters();

        }
      );

    });

}


/* =========================================================
   CARDÁPIO
========================================================= */

function renderMenu(){

  const t =
    UI[currentLang];


  const index =
    langIndex[currentLang];


  const visibleSections =
    MENU.filter(section =>

      currentFilter === 'all'

      ||

      section.cat === currentFilter

    );


  document.getElementById('menu').innerHTML =
    visibleSections.map(section => {


      const note =
        section.note
        ? `
          <div class="section-note">
            ${t[section.note]}
          </div>
        `
        : '';


      const items =
        section.items.map(item => {


          const extraNote =
            item[8]

            ? `
              <span class="item-desc">
                ${t[item[8]]}
              </span>
            `

            : '';


          return `

            <div class="menu-item">

              <div class="item-name">

                ${item[index]}

                ${extraNote}

              </div>


              <div class="price">

                ${money(item[7])}

              </div>

            </div>

          `;

        }).join('');


      return `

        <article
          class="section-card ${section.cat === 'meals' ? 'full' : ''}">


          <div class="section-head">

            <h2 class="section-title">

              ${t[section.cat]}

            </h2>


            <div class="section-icon">

              ${section.icon}

            </div>

          </div>


          ${note}


          <div class="items">

            ${items}

          </div>

        </article>

      `;

    }).join('');

}


/* =========================================================
   RENDERIZAÇÃO GERAL
========================================================= */

function render(){

  const t =
    UI[currentLang];


  document
    .getElementById('heroSub')
    .textContent =
    t.heroSub;


  document
    .getElementById('heroNote')
    .textContent =
    t.heroNote;


  document
    .getElementById('pixLabel')
    .textContent =
    t.pix;


  document
    .getElementById('cardsLabel')
    .textContent =
    t.payment;


  document
    .getElementById('cardsText')
    .textContent =
    t.cards;


  document
    .getElementById('currencyLabel')
    .textContent =
    t.currency;


  document
    .getElementById('currencyText')
    .textContent =
    t.currencyText;


  document
    .getElementById('footerTitle')
    .textContent =
    t.footerTitle;


  document
    .getElementById('footerText')
    .textContent =
    t.footer;


  buildLanguages();

  buildFilters();

  renderMenu();

}


/* =========================================================
   INICIAR
========================================================= */

render();
