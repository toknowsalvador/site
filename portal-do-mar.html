const fmt = v => typeof v === 'number' ? `R$ ${v.toFixed(2).replace('.',',')}` : `R$ ${String(v).replaceAll('.',',')}`;
const state={lang:'en'};
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function getLangFromUrl(){const p=new URLSearchParams(location.search).get('lang');return DATA.langs.includes(p)?p:'en'}
function setLang(lang){state.lang=lang;document.documentElement.lang=lang;document.documentElement.dir=lang==='he'?'rtl':'ltr';const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState({},'',u);render();}
function renderLangBar(){const bar=document.getElementById('langbar');bar.innerHTML=DATA.langs.map(l=>`<button class="langbtn no-select ${l===state.lang?'active':''}" type="button" onclick="setLang('${l}')">${escapeHtml(DATA.langNames[l])}</button>`).join('');const active=bar.querySelector('.active');active?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}
function renderCategoryBar(){const bar=document.getElementById('categorybar');bar.innerHTML=DATA.sections.map(section=>`<button class="catbtn no-select" type="button" onclick="goToSection('${section.key}')">${escapeHtml(section.title[state.lang])}</button>`).join('');}
function goToSection(key){document.getElementById(key)?.scrollIntoView({behavior:'smooth',block:'start'});}
function render(){const lang=state.lang,L=DATA.labels[lang];renderLangBar();renderCategoryBar();document.getElementById('heroEyebrow').textContent=L.menu;document.getElementById('heroSub').textContent=L.subtitle;document.title=`Portal do Mar | ${L.menu}`;
let out='';for(const section of DATA.sections){out+=`<section class="section" id="${section.key}"><h3>${escapeHtml(section.title[lang])}</h3>`;if(section.key==='pizza'){out+=`<div class="pizza-head"><span>${escapeHtml(L.small)}</span><span>${escapeHtml(L.medium)}</span><span>${escapeHtml(L.family)}</span></div>`}
for(const it of section.items){if(it.pizza){out+=`<div class="item pizza-item"><div class="num">${it.n}</div><div class="name">${escapeHtml(it.name[lang])}</div><div class="pizza-prices">${it.prices.map(p=>`<span>${fmt(p)}</span>`).join('')}</div></div>`}else{out+=`<div class="item"><div class="num">${it.n}</div><div class="name">${escapeHtml(it.name[lang])}</div><div class="price">${fmt(it.price)}</div></div>`}}
if(section.note)out+=`<div class="note">${escapeHtml(section.note[lang])}</div>`;out+='</section>'}
document.getElementById('menu').innerHTML=out;document.getElementById('expTitle').textContent=L.experiences;document.getElementById('expSub').textContent=L.expSub;document.getElementById('footerText').textContent=L.footer;document.getElementById('backTop').textContent=L.top;renderExperiences();}
function renderExperiences(){const lang=state.lang,L=DATA.labels[lang];document.getElementById('expCards').innerHTML=DATA.experiences.map(exp=>{const name=exp.names[lang];let url=exp.url;if(!url){const msg=DATA.messages[lang].replace('{exp}',name);url=`https://wa.me/${DATA.whatsapp}?text=${encodeURIComponent(msg)}`;}const cta=exp.id==='afro'||exp.id==='free'?L.direct:L.whatsapp;return `<a class="exp-card no-select" href="${escapeHtml(url)}" target="_blank" rel="noopener"><strong>${escapeHtml(name)}</strong><span>${escapeHtml(cta)} →</span></a>`}).join('')}
